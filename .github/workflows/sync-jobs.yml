name: Sync job boards

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger crawl
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "https://resumely.online/api/jobs/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
